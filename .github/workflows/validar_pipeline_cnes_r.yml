name: validar-pipeline-cnes-r

on:
  push:
    branches:
      - main
      - work
      - feature/**
      - feat/**
      - test/**
      - metadata/**
    paths:
      - 'src/**'
      - 'tests/**'
      - 'metadata/**'
      - 'config/**'
      - 'scripts/instalar_dependencias_r.R'
      - 'scripts/conferir_snapshot_cnes.R'
      - 'scripts/preparar_cache_cnes.R'
      - 'scripts/comparar_reprocessamento_cnes.R'
      - 'scripts/auditar_territorio_habilitacoes.R'
      - '.github/workflows/validar_pipeline_cnes_r.yml'
      - 'docs/cnes/**'
      - 'docs/fluxo_trabalho.md'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'metadata/**'
      - 'config/**'
      - 'scripts/instalar_dependencias_r.R'
      - 'scripts/conferir_snapshot_cnes.R'
      - 'scripts/preparar_cache_cnes.R'
      - 'scripts/comparar_reprocessamento_cnes.R'
      - 'scripts/auditar_territorio_habilitacoes.R'
      - '.github/workflows/validar_pipeline_cnes_r.yml'
      - 'docs/cnes/**'
      - 'docs/fluxo_trabalho.md'

jobs:
  teste-cnes-r:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Verificar R e Rscript
        run: |
          which R
          which Rscript
          R --version
          Rscript --version

      - name: Exibir sessão R
        run: Rscript -e 'sessionInfo()'

      - name: Preparar dependências do pipeline
        run: Rscript scripts/instalar_dependencias_r.R

      - name: Executar teste estrutural do repositório
        run: Rscript tests/test_estrutura_repositorio.R

      - name: Executar teste de metadados CNES
        run: Rscript tests/test_metadata_cnes.R

      - name: Executar teste de classificação de habilitações CNES
        run: Rscript tests/test_classificacao_habilitacoes_cnes.R

      - name: Executar teste de leitura CNES
        run: Rscript tests/test_ler_arquivos_cnes.R

      - name: Executar teste de padronização CNES
        run: Rscript tests/test_padronizar_cnes_interim.R

      - name: Executar teste de validação CNES
        run: Rscript tests/test_validar_pipeline_cnes.R

      - name: Executar teste de orquestração CNES
        run: Rscript tests/test_executar_pipeline_piloto_cnes.R

      - name: Executar teste de integração CNES
        run: Rscript tests/teste_pipeline_piloto_cnes.R

      - name: Executar teste de indicadores de oferta CNES
        run: Rscript tests/test_indicadores_cnes_oferta.R

      - name: Conferir proteção contra divergências de contrato dos snapshots
        run: Rscript tests/test_conferir_contrato_snapshot_cnes.R

      - name: Validar cache comprimido e identificadores CNES sem Git LFS
        run: Rscript tests/test_cache_cnes.R

      - name: Validar contrato de correspondência territorial
        run: Rscript tests/test_correspondencia_territorial.R

      - name: Validar fila de revisão sem alterar classificação
        run: Rscript tests/test_fila_revisao_habilitacoes.R

      - name: Verificar preparadores sem descarte implícito
        run: Rscript tests/test_preparadores_sem_descarte.R

      - name: Verificar classificação territorial congelada
        run: Rscript tests/test_territorio_congelado.R

      - name: Verificar separação de escopos e códigos preliminares dos dossiês
        run: Rscript tests/test_configuracao_dossies.R
